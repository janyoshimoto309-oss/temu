<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="row">
        <strong>Temu × 知了筛选</strong>
        <label class="power" title="插件总开关">
          <input id="pluginOn" type="checkbox" checked />
          <span class="track"><span class="knob"></span></span>
        </label>
      </div>
      <p id="hint" class="hint">开：筛选、半价、自动点开可用。关：清变灰、停自动点开，面板仍可改规则。</p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
